name: Verify FriendStack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rooms:
        description: Concurrent card rooms for the isolated load run
        type: choice
        options: ["100", "500"]
        default: "100"
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cloud
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Load smoke test
        if: github.event_name != 'workflow_dispatch'
        run: npm run test:load -- --rooms=25
      - name: Extended load run
        if: github.event_name == 'workflow_dispatch'
        env:
          LOAD_ROOMS: ${{ inputs.rooms }}
        run: npm run test:load -- --rooms="$LOAD_ROOMS"
